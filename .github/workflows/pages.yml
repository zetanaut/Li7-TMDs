name: Pages
on:
  workflow_dispatch:
    inputs:
      publication_authorized:
        description: Explicit author approval to publish this exact default-branch commit
        type: boolean
        required: true
        default: false
      approved_sha:
        description: Full SHA of the validated main commit to deploy
        type: string
        required: true
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify dispatch and current default-branch revision
        shell: bash
        env:
          PUBLICATION_APPROVAL: ${{ inputs.publication_authorized }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLICATION_APPROVAL" = true
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-repro-py311.txt
      - run: python -m pip check
      - name: Require complete same-revision evidence and authorized publication
        shell: bash
        env:
          PUBLICATION_APPROVAL: ${{ inputs.publication_authorized }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          python scripts/run_validation.py --profile full --output-root validation_runs | tee /tmp/li7-full.log
          run_dir=$(sed -n 's/^Run directory: //p' /tmp/li7-full.log)
          test -n "$run_dir"
          LI7_RELEASE_FULL_RUN_DIR="$run_dir" python -m unittest discover -s tests -v
          python scripts/check_foundation_certificates.py
          python scripts/check_gluon_angular_certificate.py
          python scripts/check_collinear_block_certificate.py
          python scripts/check_publication_eligibility.py --run-dir "$run_dir" \
            --require-publication-authorization --publication-approval "$PUBLICATION_APPROVAL" \
            --approved-revision "$APPROVED_SHA"
          python scripts/update_report_summary.py --run-dir "$run_dir" --output docs/generated-results.md
          python scripts/make_plots.py --run-dir "$run_dir"
          mkdocs build --strict
          python scripts/check_public_scope.py --site site
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SHA"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Recheck approved default-branch revision
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SHA"
      - id: deployment
        uses: actions/deploy-pages@v5
