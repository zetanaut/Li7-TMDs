name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Require complete same-revision evidence and authorized publication
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_validation.py --profile full --output-root validation_runs | tee /tmp/li7-full.log
          run_dir=$(sed -n 's/^Run directory: //p' /tmp/li7-full.log)
          test -n "$run_dir"
          python scripts/check_foundation_certificates.py
          python scripts/check_gluon_angular_certificate.py
          python scripts/check_collinear_block_certificate.py
          python scripts/check_publication_eligibility.py --run-dir "$run_dir" --require-publication-authorization
          python scripts/update_report_summary.py --run-dir "$run_dir" --output docs/generated-results.md
          python scripts/make_plots.py --run-dir "$run_dir"
          mkdocs build --strict
          python scripts/check_public_scope.py --site site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
