name: Validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Execute baseline and build its evidence-backed documentation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_validation.py --profile baseline --output-root validation_runs | tee /tmp/li7-validation.log
          run_dir=$(sed -n 's/^Run directory: //p' /tmp/li7-validation.log)
          test -n "$run_dir"
          python scripts/update_report_summary.py --run-dir "$run_dir"
          python scripts/make_plots.py --run-dir "$run_dir"
          mkdocs build --strict
          python scripts/check_public_scope.py --site site
