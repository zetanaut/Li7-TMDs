name: Validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/validate_spin32_tmd.py --output results/validation_report.json
      - run: python src/gluon_born_response.py --output results/gluon_born_report.json
      - run: python examples/reproduce_gluon_grid.py --output results/gluon_born_grid_report.json
      - run: python -m unittest discover -s tests -v
      - run: python scripts/make_plots.py
      - run: python scripts/update_report_summary.py
      - run: mkdocs build --strict
