name: Validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-repro-py311.txt
      - run: python -m pip check
      - name: Execute complete same-revision validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_validation.py --profile full --output-root validation_runs | tee /tmp/li7-full.log
          run_dir=$(sed -n 's/^Run directory: //p' /tmp/li7-full.log)
          test -n "$run_dir"
          LI7_RELEASE_FULL_RUN_DIR="$run_dir" python -m unittest discover -s tests -v
          python scripts/check_foundation_certificates.py
          python scripts/check_gluon_angular_certificate.py
          python scripts/check_collinear_block_certificate.py
          python scripts/check_publication_eligibility.py --run-dir "$run_dir"
          python scripts/update_report_summary.py --run-dir "$run_dir" --output docs/generated-results.md
          python scripts/make_plots.py --run-dir "$run_dir"
          mkdocs build --strict
          python scripts/check_public_scope.py --site site
